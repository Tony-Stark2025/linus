[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linus-agent"
version = "0.2.0"
description = "Linus: Autonomous Adversarial Pull Request Verifier built with Strands Agents SDK & Amazon Bedrock AgentCore"
readme = "README.md"
authors = [
    { name = "Linus Contributors" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sse-starlette>=2.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "strands-agents>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["linus*", "web_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
norecursedirs = ["tests/regressions"]

